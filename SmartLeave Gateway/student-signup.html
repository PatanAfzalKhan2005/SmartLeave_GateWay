<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup - MITS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">MITS Permission System</h2>
            <p class="auth-subtitle">Create Student Account</p>
            
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="student@mits.ac.in" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="auth-button">Sign Up</button>
            </form>
            
            <div class="auth-links">
                <p class="auth-link">Already have an account? <a href="student-login.html">Login</a></p>
                <p class="auth-link"><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value.toLowerCase();
            const password = document.getElementById('password');
            
            // Client-side duplicate check as backup
            const existingEmails = JSON.parse(localStorage.getItem('registeredEmails') || '[]');
            if (existingEmails.includes(email)) {
                alert('Email already registered');
                return;
            }
            
            try {
                console.log('Attempting signup with:', { fullName, email });
                
                const response = await fetch('https://gih9r2rsc3.execute-api.ap-south-1.amazonaws.com/dev/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        college_mail: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                console.log('Response status:', response.status, 'OK:', response.ok);
                console.log('Response data:', data);
                
                if (response.status === 200 && response.ok) {
                    // Store email to prevent future duplicates
                    existingEmails.push(email);
                    localStorage.setItem('registeredEmails', JSON.stringify(existingEmails));
                    localStorage.setItem('signupName', fullName);
                    
                    alert('Account created successfully!');
                    window.location.href = 'student-login.html';
                } else {
                    // Handle all error cases
                    let errorMessage = data.message || data.error || 'Signup failed';
                    console.log('Signup failed:', errorMessage);
                    alert(errorMessage);
                }
            } catch (error) {
                console.error('Network error:', error);
                alert('Signup failed: ' + error.message);
            }
        });
    </script>
</body>
</html>
