<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOD Login - MITS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">MITS Permission System</h2>
            <p class="auth-subtitle">HOD Login</p>
            
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="hod@mits.ac.in" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="auth-button">Login</button>
            </form>
            
            <div class="auth-links">
                <p class="auth-link"><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // HOD hardcoded login
            if (email === 'hod@mits.ac.in' && password === 'hod123') {
                const hodUser = {
                    name: 'K. Dinesh',
                    email: email,
                    role: 'hod',
                    department: 'Computer Science & Technology'
                };
                localStorage.setItem('currentUser', JSON.stringify(hodUser));
                window.location.href = 'hod-dashboard.html';
            } else {
                alert('Invalid credentials');
            }
        });
    </script>
</body>
</html>
